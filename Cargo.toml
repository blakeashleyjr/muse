[workspace]
resolver = "2"
members = [
    "crates/muse-core",
    "crates/muse-emulator",
    "crates/muse-render",
    "crates/muse-diff",
    "crates/muse-trace",
    "crates/muse-pty",
    "crates/muse-engine",
    "crates/muse-runner",
    "crates/muse-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blakeashleyjr/muse"
homepage = "https://github.com/blakeashleyjr/muse"
readme = "README.md"
keywords = ["terminal", "testing", "tui", "snapshot", "vt"]
categories = ["development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
muse-core = { path = "crates/muse-core", version = "0.1.0" }
muse-emulator = { path = "crates/muse-emulator", version = "0.1.0" }
muse-render = { path = "crates/muse-render", version = "0.1.0" }
muse-trace = { path = "crates/muse-trace", version = "0.1.0" }
muse-pty = { path = "crates/muse-pty", version = "0.1.0" }
muse-diff = { path = "crates/muse-diff", version = "0.1.0" }
muse-engine = { path = "crates/muse-engine", version = "0.1.0" }

# Shared third-party deps
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
unicode-width = "0.2"
unicode-segmentation = "1"
regex = "1"
vte = "0.13"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-util"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
similar = "2"
toml = "0.8"
tracing = "0.1"
muse-runner = { path = "crates/muse-runner", version = "0.1.0" }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
