// muse wire protocol — single source of truth (§15).
//
// The reference engine ships an embedded (in-process) implementation; this
// definition documents the language-agnostic gRPC/Connect surface from which
// the Go / TS / Python / C++ / Rust SDK bases are generated (§16). Field
// numbers are contiguous and stable.
syntax = "proto3";
package muse.v1;

service MuseService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc NewContext(NewContextRequest) returns (NewContextResponse);
  rpc CloseContext(CloseContextRequest) returns (CloseContextResponse);
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Key(KeyRequest) returns (KeyResponse);
  rpc Mouse(MouseRequest) returns (MouseResponse);
  rpc Resize(ResizeRequest) returns (ResizeResponse);
  rpc Paste(PasteRequest) returns (PasteResponse);
  rpc ResolveLocator(ResolveLocatorRequest) returns (ResolveLocatorResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc Assert(AssertRequest) returns (AssertResponse);
  rpc SetProfile(SetProfileRequest) returns (SetProfileResponse);
  rpc BeginStep(BeginStepRequest) returns (BeginStepResponse);
  rpc EndStep(EndStepRequest) returns (EndStepResponse);
  rpc StartTrace(StartTraceRequest) returns (StartTraceResponse);
  rpc ExportTrace(ExportTraceRequest) returns (ExportTraceResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message HandshakeRequest { uint32 protocol_version = 1; }
message HandshakeResponse { uint32 protocol_version = 1; string engine_version = 2; }
message NewContextRequest { string profile = 1; uint32 cols = 2; uint32 rows = 3; }
message NewContextResponse { string id = 1; }
message CloseContextRequest { string id = 1; }
message CloseContextResponse {}
message SpawnRequest {
  string context = 1;
  repeated string argv = 2;
  map<string, string> env = 3;
  string cwd = 4;
}
message SpawnResponse { string id = 1; }

message WriteRequest { string terminal = 1; bytes data = 2; }
message WriteResponse {}
message PasteRequest { string terminal = 1; bytes data = 2; }
message PasteResponse {}
message ResizeRequest { string terminal = 1; uint32 cols = 2; uint32 rows = 3; }
message ResizeResponse {}

enum SpecialKey {
  SPECIAL_KEY_UNSPECIFIED = 0;
  SPECIAL_KEY_ENTER = 1;
  SPECIAL_KEY_TAB = 2;
  SPECIAL_KEY_BACKSPACE = 3;
  SPECIAL_KEY_ESCAPE = 4;
  SPECIAL_KEY_UP = 5;
  SPECIAL_KEY_DOWN = 6;
  SPECIAL_KEY_LEFT = 7;
  SPECIAL_KEY_RIGHT = 8;
  SPECIAL_KEY_HOME = 9;
  SPECIAL_KEY_END = 10;
  SPECIAL_KEY_PAGE_UP = 11;
  SPECIAL_KEY_PAGE_DOWN = 12;
  SPECIAL_KEY_INSERT = 13;
  SPECIAL_KEY_DELETE = 14;
  SPECIAL_KEY_F = 15;
}
message Key {
  oneof k { string char = 1; SpecialKey special = 2; }
  uint32 fnum = 3; // for F-keys
}
message KeyRequest { string terminal = 1; Key key = 2; uint32 mods = 3; }
message KeyResponse {}

message MouseRequest {
  string terminal = 1;
  uint32 button = 2;   // 0=left 1=middle 2=right 64=wheel-up 65=wheel-down
  uint32 action = 3;   // 0=press 1=release 2=move
  uint32 row = 4;
  uint32 col = 5;
  uint32 mods = 6;
}
message MouseResponse {}

// ---- locators -------------------------------------------------------------
message Rect { uint32 row = 1; uint32 col = 2; uint32 w = 3; uint32 h = 4; }
message TextLoc { string pattern = 1; bool ignore_case = 2; bool whole_line = 3; }
message CellLoc { uint32 row = 1; uint32 col = 2; }
message LineLoc { uint32 row = 1; }
message StyledLoc { string text = 1; Color fg = 2; Color bg = 3; uint32 attrs_all = 4; uint32 attrs_any = 5; }
message CursorLoc {}
message Locator {
  oneof l {
    TextLoc text = 1;
    string regex = 2;
    CellLoc cell = 3;
    Rect region = 4;
    StyledLoc styled = 5;
    CursorLoc cursor = 6;
    LineLoc line = 7;
  }
}
message ResolveLocatorRequest { string terminal = 1; Locator loc = 2; bool multiline = 3; uint32 deadline_ms = 4; }
message Match { Rect rect = 1; string text = 2; }
message ResolveLocatorResponse { repeated Match matches = 1; }

// ---- colors / style -------------------------------------------------------
message Color {
  oneof c { bool default = 1; uint32 indexed = 2; uint32 rgb = 3; }
}
message CellStyle { Color fg = 1; Color bg = 2; Color underline = 3; uint32 attrs = 4; }

// ---- snapshots ------------------------------------------------------------
message SnapshotRequest {
  string terminal = 1;
  uint32 kind = 2;          // 0=text 1=styled 2=pixel
  uint32 pixel_scale = 3;
  uint32 min_stable_frames = 4;
  uint32 deadline_ms = 5;
}
message StyleRun { uint32 start_col = 1; uint32 len = 2; CellStyle style = 3; }
message StyledRow { string text = 1; repeated StyleRun runs = 2; }
message StyledSnapshot { repeated StyledRow rows = 1; }
message SnapshotResponse {
  oneof s { string text = 1; StyledSnapshot styled = 2; bytes png = 3; }
}

// ---- assertions -----------------------------------------------------------
message AssertRequest {
  string terminal = 1;
  Locator loc = 2;
  bool multiline = 3;
  uint32 kind = 4;          // toBeVisible / toHaveText / toContainText / toHaveStyle
  string expected = 5;
  uint32 deadline_ms = 6;
}
message AssertResponse { bool ok = 1; string actual = 2; string expected = 3; string detail = 4; }

// ---- capabilities / profiles ----------------------------------------------
message SetProfileRequest { string terminal = 1; string profile = 2; }
message SetProfileResponse { Capabilities capabilities = 1; }
message Capabilities {
  string terminfo_name = 1;
  uint32 color = 2;
  uint32 keyboard = 3;
  bool supports_sync_output = 4;
  bool supports_bracketed_paste = 5;
  uint32 tab_width = 6;
}

// ---- steps / trace --------------------------------------------------------
message BeginStepRequest { string terminal = 1; string name = 2; }
message BeginStepResponse {}
message EndStepRequest { string terminal = 1; }
message EndStepResponse {}
message StartTraceRequest { string terminal = 1; string dir = 2; }
message StartTraceResponse {}
message ExportTraceRequest { string terminal = 1; }
message ExportTraceResponse { string path = 1; }

// ---- subscribe ------------------------------------------------------------
message SubscribeRequest { string terminal = 1; }
message SubscribeResponse { Event event = 1; }
message OutputChunk { bytes data = 1; double ts = 2; }
message Frame { uint64 generation = 1; double ts = 2; }
message Event { oneof e { OutputChunk output = 1; Frame frame = 2; } }
