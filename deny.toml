# cargo-deny configuration for muse.
#
#   cargo install cargo-deny      # or: nix-shell -p cargo-deny
#   cargo deny check              # advisories + licenses + bans + sources
#
# CI runs this via the `deny` job in .github/workflows/ci.yml.

[advisories]
# Fail on any RustSec advisory affecting the dependency tree.
version = 2
yanked = "deny"

[licenses]
version = 2
# muse is dual MIT/Apache-2.0; only allow permissive licenses for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate semver-incompatible versions of the same crate.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow crates from the official registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
